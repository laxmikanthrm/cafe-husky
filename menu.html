<!DOCTYPE html>
<!-- Menu page. HTML = structure only. ALL JavaScript is in app.js; ALL styling is in style.css. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu · Blue Husky College Cafe</title>
  <!-- Two free Google fonts (if you are offline, style.css falls back to normal fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐺</text></svg>">
</head>
<body data-page="menu">   <!-- data-page tells app.js which page this is -->
  <header class="site-header"><div class="inner">
    <a class="logo" href="index.html">🐺 Blue Husky <span>Cafe</span></a>
    <nav class="nav-links" aria-label="Main">
      <a href="index.html" data-nav="home">Home</a>
      <a href="menu.html" data-nav="menu">Menu</a>
      <a href="deals.html" data-nav="deals">Deals</a>
      <a href="checkout.html" data-nav="checkout">Checkout <span class="badge" id="cartCount">0</span></a>
    </nav>
    <div class="account" id="account"></div>   <!-- app.js puts "👤 Tom  [Sign out]" here -->
  </div></header>

  <main>
    <div class="page-banner"><h1>📖 Our Menu</h1><p>Pick a section or browse everything. Tap "Add to cart".</p></div>
    <section class="wrap">
      <div id="chips" class="chips"></div>     <!-- filter buttons: All, African, Indian, ... -->
      <div id="menuList"></div>
    </section>
  </main>
  <div id="cartBar" class="cart-bar" aria-live="polite"></div>   <!-- sticky "🛒 3 items · $17.00  Go to checkout" -->

  <footer class="site-footer">
    <p><a href="index.html">Home</a> · <a href="menu.html">Menu</a> · <a href="deals.html">Deals</a> · <a href="checkout.html">Checkout</a> · <a href="login.html">Account</a></p>
    <p>Thank you for visiting Multicultural Café! Different cultures, delicious flavors, one table. 🐾</p>
  </footer>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>   <!-- ALL the JavaScript -->
</body>
</html>
